name: "testing"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    tests:
        name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependency-versions }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
              php:
                - "7.4"
                - "8.0"
                - "8.1"
                - "8.2"
                - "8.3"
                - "8.4"
                - "8.5"
              dependency-versions:
                - highest
              include:
                - php: "7.4"
                  dependency-versions: lowest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Install dependencies
              uses: ramsey/composer-install@v4
              with:
                  dependency-versions: ${{ matrix.dependency-versions }}

            - name: Tests
              run: composer test
              env:
                  EMBED_STRICT_CACHE: 1

    nightly:
        name: Tests (PHP 8.6 nightly, allowed to fail)
        runs-on: ubuntu-latest
        continue-on-error: true

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.6"
                  coverage: none

            - name: Install dependencies
              uses: ramsey/composer-install@v4
              with:
                  composer-options: --ignore-platform-req=php+

            - name: Tests
              run: composer test
              env:
                  EMBED_STRICT_CACHE: 1

    phpstan:
        name: PHPStan Static Analysis
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  coverage: none

            - name: Install dependencies
              uses: ramsey/composer-install@v4

            - name: Run PHPStan
              run: composer phpstan
